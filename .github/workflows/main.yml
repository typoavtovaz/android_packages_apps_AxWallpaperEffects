name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1-bin.zip
          unzip -q gradle-8.1-bin.zip
          echo "$PWD/gradle-8.1/bin" >> $GITHUB_PATH
      - name: Create Gradle files
        run: |
          cat > build.gradle << 'BUILDEOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.0'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
          }
          allprojects {
            repositories { google(); mavenCentral() }
          }
          BUILDEOF
          cat > settings.gradle << 'SETEOF'
          rootProject.name = "AxWallpaperEffects"
          include ':app'
          SETEOF
          mkdir -p app
          cat > app/build.gradle << 'APPEOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace "com.android.axion.wallpapereffects"
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.android.axion.wallpapereffects"
              minSdkVersion 31
              targetSdkVersion 34
            }
            sourceSets {
              main {
                manifest.srcFile '../AndroidManifest.xml'
                java.srcDirs = ['../src']
                res.srcDirs = ['../res']
                assets.srcDirs = ['../assets']
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
            implementation 'org.tensorflow:tensorflow-lite:2.14.0'
            implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
          }
          APPEOF
          gradle wrapper --gradle-version 8.1
      - name: Create gradle.properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEffects-debug
          path: app/build/outputs/apk/debug/app-debug.apk
