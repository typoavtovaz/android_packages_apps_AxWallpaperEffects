name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Gradle files
        run: |
          echo 'rootProject.name = "AxWallpaperEffects"' > settings.gradle
          echo 'include ":app"' >> settings.gradle
          mkdir -p app
          printf 'plugins {\n    id "com.android.application"\n    id "org.jetbrains.kotlin.android"\n}\nandroid {\n    namespace "com.android.axion.wallpapereffects"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.android.axion.wallpapereffects"\n        minSdk 31\n        targetSdk 34\n    }\n    sourceSets {\n        main {\n            manifest.srcFile "../AndroidManifest.xml"\n            java.srcDirs = ["../src"]\n            res.srcDirs = ["../res"]\n            assets.srcDirs = ["../assets"]\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = "17" }\n}\ndependencies {\n    implementation "androidx.core:core-ktx:1.12.0"\n}\n' > app/build.gradle
          printf 'plugins {\n    id "com.android.application" version "8.1.0" apply false\n    id "org.jetbrains.kotlin.android" version "1.9.0" apply false\n}\n' > build.gradle
          gradle wrapper --gradle-version 8.1
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEffects-debug
          path: app/build/outputs/apk/debug/app-debug.apk
